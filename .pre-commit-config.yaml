repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: tsc
        name: TypeScript typecheck
        entry: bash -c 'cd client && npx tsc --noEmit'
        language: system
        pass_filenames: false
      - id: pytest
        name: Server tests
        entry: bash -c 'cd server && .venv/bin/python -m pytest tests -q'
        language: system
        pass_filenames: false
